syntax = "proto3";

import "google/protobuf/empty.proto";
import "ru/practicum/message/collector/user_action.proto";

package stats.service.collector;

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.message.collector.controller";

service UserActionController {
    rpc CollectUserAction (ru.practicum.message.collector.user.UserActionProto)
            returns (google.protobuf.Empty);
}