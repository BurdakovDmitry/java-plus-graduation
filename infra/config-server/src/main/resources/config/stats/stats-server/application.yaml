server:
  port: 0

spring:
  application:
    name: "stats-server"

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stat;MODE=PostgreSQL
    username: user
    password: password

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        format_sql: true

format:
  pattern:
    datetime: "yyyy-MM-dd HH:mm:ss"