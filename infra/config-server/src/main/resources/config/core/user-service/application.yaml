server:
  port: 0

spring:
  application:
    name: "user-service"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/user
    username: user
    password: password

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        format_sql: true