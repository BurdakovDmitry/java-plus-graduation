server:
  port: 0

grpc:
  client:
    collector:
      address: "discovery:///collector"
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: "plaintext"
    analyzer:
      address: "discovery:///analyzer"
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: "plaintext"

spring:
  application:
    name: "event-service"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/event
    username: user
    password: password

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        format_sql: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

management:
  health:
    circuitbreaker:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        failure-rate-threshold: 50
        register-health-indicator: true

format:
  pattern:
    datetime: "yyyy-MM-dd HH:mm:ss"